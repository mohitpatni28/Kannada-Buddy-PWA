name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22.22.2", "24.15.0", "26"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.30.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm content:validate
      - run: pnpm content:validate-all
      - run: pnpm build
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm examples:check
      - run: pnpm docs:check
      - run: pnpm audit --audit-level low
      - name: Dependency license evidence
        run: pnpm licenses list --json > "$RUNNER_TEMP/dependency-licenses.json"

  audio-tooling:
    name: Validate optional audio inference
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned inference dependencies
        env:
          AUDIO_ENV_DIR: ${{ runner.temp }}/audio-env
        run: |
          PYTHON_BIN=python sh scripts/setup-audio-env.sh
      - name: Test inference without model access
        env:
          AUDIO_ENV_DIR: ${{ runner.temp }}/audio-env
          HF_HUB_OFFLINE: "1"
        run: |
          "$AUDIO_ENV_DIR/bin/python" -m unittest discover -s audio/tests -v
      - name: Audit every installed third-party dependency
        env:
          AUDIO_ENV_DIR: ${{ runner.temp }}/audio-env
          AUDIT_ENV_DIR: ${{ runner.temp }}/audio-auditor
        run: |
          python -m venv "$AUDIT_ENV_DIR"
          "$AUDIT_ENV_DIR/bin/python" -m pip install pip-audit==2.10.1
          python scripts/audit-audio-env.py \
            --environment-python "$AUDIO_ENV_DIR/bin/python" \
            --auditor-python "$AUDIT_ENV_DIR/bin/python" \
            --output "$RUNNER_TEMP/audio-audit.json"

  secrets:
    name: Scan publication tree and fetched history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download checksum-pinned gitleaks
        env:
          SCANNER_DIR: ${{ runner.temp }}/gitleaks
        run: |
          mkdir -p "$SCANNER_DIR"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$SCANNER_DIR/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $SCANNER_DIR/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$SCANNER_DIR/gitleaks.tar.gz" -C "$SCANNER_DIR" gitleaks
          "$SCANNER_DIR/gitleaks" version
      - name: Scan all fetched refs and tracked tree
        env:
          SCANNER_DIR: ${{ runner.temp }}/gitleaks
          PUBLICATION_TREE: ${{ runner.temp }}/publication-tree
        run: |
          "$SCANNER_DIR/gitleaks" git --redact --log-opts="--all" .
          mkdir -p "$PUBLICATION_TREE"
          git ls-files -z | tar --null -T - -cf "$RUNNER_TEMP/publication-tree.tar"
          tar -xf "$RUNNER_TEMP/publication-tree.tar" -C "$PUBLICATION_TREE"
          "$SCANNER_DIR/gitleaks" dir --redact "$PUBLICATION_TREE"
